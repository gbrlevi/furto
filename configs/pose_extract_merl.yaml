# MERL Shopping Dataset (Singh et al., CVPR 2016; research and educational use), overhead
# camera of a mock shop, 920 x 680 at 30 fps. Poses for the shelf-contact and product-in-hand
# stages of the item pipeline. Same stack as ADR-0013, HRNet run by TensorRT FP16 (ADR-0016,
# parity measured in session 3B) to fit 106 videos in a couple of hours.
name: pose_extract_merl
device: cuda:0
target_fps: 15
max_output_frames: null
copy_to: data/interim/merl

detector:
  name: yolov8m
  weights: data/weights/ultralytics/yolov8m.pt
  conf: 0.1
  imgsz: 640
  half: false

tracker:
  tracker_type: bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  fuse_score: true

pose:
  name: td-hm_hrnet-w32_8xb64-210e_coco-256x192
  config: data/weights/mmpose/td-hm_hrnet-w32_8xb64-210e_coco-256x192.py
  weights: data/weights/mmpose/td-hm_hrnet-w32_8xb64-210e_coco-256x192-81c58e40_20220909.pth
  flip_test: true

onnx:
  fp16: false
  opset: 17
  providers:
    - name: TensorrtExecutionProvider
      options:
        trt_fp16_enable: true
        trt_engine_cache_enable: true
        trt_engine_cache_path: data/weights/trt_cache
        trt_profile_min_shapes: "input:1x3x256x192"
        trt_profile_opt_shapes: "input:4x3x256x192"
        trt_profile_max_shapes: "input:16x3x256x192"
    - name: CUDAExecutionProvider

videos:
  - {id: "1_1", camera: merl, path: data/raw/merl/videos/Videos_MERL_Shopping_Dataset/1_1_crop.mp4}
  - {id: "1_2", camera: merl, path: data/raw/merl/videos/Videos_MERL_Shopping_Dataset/1_2_crop.mp4}

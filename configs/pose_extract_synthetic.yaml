# The ten generated videos of the synthetic probe (configs/synthetic_probe), 1280 x 720
# at 24 fps; same stack as ADR-0013 through MMPose (flip test kept).
name: pose_extract_synthetic
device: cuda:0
target_fps: 15
max_output_frames: null
copy_to: data/interim/synthetic

detector:
  name: yolov8m
  weights: data/weights/ultralytics/yolov8m.pt
  conf: 0.1
  imgsz: 640
  half: false

tracker:
  tracker_type: bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  fuse_score: true

pose:
  name: td-hm_hrnet-w32_8xb64-210e_coco-256x192
  config: data/weights/mmpose/td-hm_hrnet-w32_8xb64-210e_coco-256x192.py
  weights: data/weights/mmpose/td-hm_hrnet-w32_8xb64-210e_coco-256x192-81c58e40_20220909.pth
  flip_test: true

videos:
  - {id: "p1_concealment", camera: synthetic, path: data/raw/synthetic/p1_concealment.mp4}
  - {id: "p1_normal", camera: synthetic, path: data/raw/synthetic/p1_normal.mp4}
  - {id: "p2_concealment", camera: synthetic, path: data/raw/synthetic/p2_concealment.mp4}
  - {id: "p2_normal", camera: synthetic, path: data/raw/synthetic/p2_normal.mp4}
  - {id: "p3_concealment", camera: synthetic, path: data/raw/synthetic/p3_concealment.mp4}
  - {id: "p3_normal", camera: synthetic, path: data/raw/synthetic/p3_normal.mp4}
  - {id: "p4_concealment", camera: synthetic, path: data/raw/synthetic/p4_concealment.mp4}
  - {id: "p4_normal", camera: synthetic, path: data/raw/synthetic/p4_normal.mp4}
  - {id: "p5_concealment", camera: synthetic, path: data/raw/synthetic/p5_concealment.mp4}
  - {id: "p5_normal", camera: synthetic, path: data/raw/synthetic/p5_normal.mp4}

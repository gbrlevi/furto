# UCF-Crime for the item pipeline: the 21 officially annotated Shoplifting videos, the 13
# held out with UCA labels and the 38 normal videos of the measure part of the earlier split
# (scripts/vlm_theft_eval.py normal_parts). 320 x 240, 30 fps. Same stack as configs/pose_extract_merl.yaml.
name: pose_extract_ucf_items
device: cuda:0
target_fps: 15
max_output_frames: null
copy_to: data/interim/ucf_items

detector:
  name: yolov8m
  weights: data/weights/ultralytics/yolov8m.pt
  conf: 0.1
  imgsz: 640
  half: false

tracker:
  tracker_type: bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  fuse_score: true

pose:
  name: td-hm_hrnet-w32_8xb64-210e_coco-256x192
  config: data/weights/mmpose/td-hm_hrnet-w32_8xb64-210e_coco-256x192.py
  weights: data/weights/mmpose/td-hm_hrnet-w32_8xb64-210e_coco-256x192-81c58e40_20220909.pth
  flip_test: true

onnx:
  fp16: false
  opset: 17
  providers:
    - name: TensorrtExecutionProvider
      options:
        trt_fp16_enable: true
        trt_engine_cache_enable: true
        trt_engine_cache_path: data/weights/trt_cache
        trt_profile_min_shapes: "input:1x3x256x192"
        trt_profile_opt_shapes: "input:4x3x256x192"
        trt_profile_max_shapes: "input:16x3x256x192"
    - name: CUDAExecutionProvider

videos:
  - {id: "Shoplifting001_x264", camera: ucf, path: data/raw/ucf_crime/Shoplifting001_x264.mp4}
  - {id: "Shoplifting004_x264", camera: ucf, path: data/raw/ucf_crime/Shoplifting004_x264.mp4}

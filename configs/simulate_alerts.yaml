# Session 3, task C6: alerts per hour as a function of the threshold, validation only.
# Operation mode (ADR-0008): window score on its last frame, maximum over people, no
# smoothing; alert logic of session 2D. Validation has only normal behaviour, so every
# alert is a false alert. The N is chosen by the group (task C7), not here.
models:
  quality_gate_on: runs/20261026-225403_train_c1_base  # production (A2.5)
  quality_gate_off: runs/20261026-225828_train_c1_gate_off  # pre-declared sensitivity
min_alert_frames: 15  # 1 s at 15 fps (group, 26/10/2026)
merge_gap_frames: 30  # alerts less than 2 s apart are merged
# Candidate thresholds: unique quantiles of the scored validation frames at n evenly
# spaced levels from low to high (the original PoC used 0.5, 0.99999, 400; high = 1 here
# so that the curve reaches zero alerts).
candidates: {low: 0.5, high: 1.0, n: 1000}
target_rates: [1, 2, 5, 10]  # alerts per hour shown to the group (session 3, C7)
device: cuda
batch_size: 1024

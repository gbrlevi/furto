# Equivalence of the port with the original PoC reference (session 2, tasks 7 and 10).
reference_dir: data/reference/poc_luiz_seed0
dataset_config: configs/poselift.yaml
dataset_overrides:  # reproduces the original reading
  keypoint_order: as_is
  nan_confidence: one
split: {val_fraction: 0.15, seed: 0}  # treinar.py defaults
treatment:  # treinar.py / dados.Config defaults
  T: 24
  stride_eval: 1
  max_gap: 8
  conf_min: 0.1
  center: frame
model:  # avaliar.inferir: batch of 1024 windows, loss normalized by the confidence sum
  device: cuda  # same device as the reference (val_ref.npz records it)
  batch_size: 1024
  tolerance: {rtol: 1.0e-5, atol: 1.0e-7}  # float32; different cuDNN kernels may be picked

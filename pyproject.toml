[project]
name = "tcc"
version = "0.1.0"
description = "Triagem de comportamentos compatíveis com furto a partir de pose humana (TCC UNIFOR)"
requires-python = "==3.11.*"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch>=2.14,<2.15",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-psutil>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc"]

# cu126: a variante de CUDA mais nova com sm_75 (Turing, RTX 2060) garantido nos wheels.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^legacy/"]

[[tool.mypy.overrides]]
# mmpose, mmengine and ultralytics live only in .venv-pose (session 2B)
module = ["cv2.*", "sklearn.*", "scipy.*", "matplotlib.*", "mmpose.*", "mmengine.*", "ultralytics.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", "data", "runs", ".venv"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
